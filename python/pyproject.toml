[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "kime"
description = "Fast calibrated decisions from an encoder, with Laya's and TypeSafe's Python APIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/tamnd/kime"

[tool.maturin]
module-name = "kime._native"
python-source = "."
python-packages = ["kime"]
features = ["pyo3/extension-module"]
