[package]
name = "kime-python"
version = "0.0.19"
edition = "2024"
rust-version = "1.90.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/kime"
description = "The native part of the kime Python package"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kime-core = { path = "../crates/kime-core" }
kime-engine = { path = "../crates/kime-engine" }
kime-route = { path = "../crates/kime-route" }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

# Not part of the kime workspace: maturin builds it, and a workspace build should not need a
# Python interpreter.
[workspace]

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
