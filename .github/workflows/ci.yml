# The per commit gate. Everything here is required to merge.
#
# The jobs are the first rows of the CI table in spec/15-testing.md: formatting, lints, the unsafe
# audit and cargo deny on Linux, then the unit and property tests on Linux x86, Linux ARM, macOS
# and Windows. The GPU rows of that table need the self hosted T4, L4 and Apple runners, which
# arrive in M0 and M4, and they are not listed here until they exist, because a job that is red
# because its runner is missing teaches everyone to ignore a red run.
#
# Nothing here measures speed. A timing taken on a shared runner is not a timing, and the rules in
# spec/13-benchmarks.md say where the numbers come from instead.
#
# Every action is pinned to a full commit hash with the version in a comment. A tag can be moved
# after the fact and a hash cannot, and dependabot moves the hash and the comment together.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A force push should cancel the run it replaced. The default branch is exempt, because a main
# branch run is what the badge and the bisect history read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cheapest checks first, so a formatting mistake costs seconds rather than a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: prose style
        run: cargo xtask style
      # Unsafe is allowed in kime-tensor, the four backends and kime-tok, per spec/07-engine.md,
      # and every other crate root has to forbid it. Cheap to check, expensive to find out later.
      - name: unsafe rule
        run: cargo xtask unsafe
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    # Runner images are named explicitly rather than through -latest, so that an image rollout
    # shows up as a commit rather than as yesterday's green run turning red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64, debug
            os: ubuntu-24.04
            profile: dev
          - name: linux x86-64, release
            os: ubuntu-24.04
            profile: release
          - name: linux arm64
            os: ubuntu-24.04-arm
            profile: dev
          - name: macos arm64
            os: macos-26
            profile: dev
          - name: windows x86-64
            os: windows-2025
            profile: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: cargo build
        run: cargo build --workspace --all-features --profile ${{ matrix.profile }}
      - name: cargo test
        run: cargo test --workspace --all-features --profile ${{ matrix.profile }}
      # The binary has to start and see the machine it is on. doctor prints the CPU features the
      # kernels dispatch on, which is the first thing to look at when one host disagrees with the
      # others.
      - name: kime doctor
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          dir=debug
          if [ "$PROFILE" = "release" ]; then dir=release; fi
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          "./target/$dir/kime$exe" --version
          "./target/$dir/kime$exe" doctor

  # The tokenizers have to give the ids Hugging Face gives, and the only way to know is to load the
  # real tokenizer files. They are small (about 40 MB for both) and fetched at a pinned revision of
  # convaiinnovations/laya, so the test cannot pass by skipping.
  tokenizers:
    name: tokenizer parity
    needs: quick
    runs-on: ubuntu-24.04
    env:
      LAYA_REVISION: 5e7b2b1b8ca2ecdd3f2322d94069c9b6ce7e844b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tokenizers
      - name: fetch the tokenizer files
        run: |
          set -euo pipefail
          for f in tokenizer/tokenizer.json tokenizer/tokenizer_config.json multilingual/tokenizer/tokenizer.json multilingual/tokenizer/tokenizer_config.json; do
            mkdir -p "models/laya/$(dirname "$f")"
            curl --fail --silent --show-error --location --retry 3 -o "models/laya/$f" "https://huggingface.co/convaiinnovations/laya/resolve/$LAYA_REVISION/$f"
          done
      - name: cargo test
        env:
          KIME_MODELS: ${{ github.workspace }}/models
          KIME_REQUIRE_MODELS: "1"
        run: cargo test --release -p kime-tok -p kime-eval

  # The checkpoint parsers read untrusted files (SECURITY.md). A minute per target on every change
  # keeps the targets building and catches the easy crashes. The long runs happen on a workstation
  # before a parser change lands.
  fuzz:
    name: fuzz the checkpoint parsers
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
          workspaces: crates/kime-model/fuzz
      - name: seeds
        run: cargo run -q -p kime-model --example fuzz_seeds -- crates/kime-model/fuzz/corpus
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target, where the address
      # sanitizer does not work, so the target is named.
      - name: cargo fuzz
        working-directory: crates/kime-model/fuzz
        run: |
          set -euo pipefail
          for t in safetensors kime_file kime_index; do
            cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=60
          done

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The kime crate is published at 1.0 and the rest may be, so every crate's documentation has
      # to build. A broken intra doc link is a broken link on docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: minimum supported rust version
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the floor from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # A library people embed in their own services cannot need last week's stable Rust. The floor
      # is raised deliberately, in a commit, not by accident in a dependency bump.
      - name: cargo check
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace --all-features

  audit:
    name: supply chain
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny
      # Licenses, advisories, banned crates and unknown registries, all configured in deny.toml.
      # The bans are the frameworks spec/07-engine.md keeps off the inference path.
      - name: cargo deny
        run: cargo deny --all-features check
      - name: report the dependency count
        run: |
          set -euo pipefail
          count() {
            cargo tree "$@" --edges normal --prefix none --all-features \
              | sed 's/ (\*)$//' | sort -u | grep -c . || true
          }
          echo "the kime crate: $(count -p kime) crates including transitives"
          echo "the workspace: $(count --workspace) crates"

  # The workflows themselves are code that runs with a token, so they get a linter too. zizmor
  # finds template injection, credentials left on disk by checkout, and actions pinned to something
  # that can move.
  workflows:
    name: workflow audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # A single required check, so the ruleset does not have to list every job above.
  ci:
    name: ci
    if: always()
    needs: [quick, test, tokenizers, fuzz, docs, msrv, audit, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
