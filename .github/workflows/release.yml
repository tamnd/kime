# Tagged releases: build the kime binary on every host spec/14-sdks-cli.md lists, attest it, and
# publish the archives as a GitHub release with the changelog section as its notes.
#
# Python wheels, the npm packages, crates.io, the container images and the model uploads join this
# workflow at M5, where the roadmap puts packaging. Until then a release is binaries only.
#
# The matrix is two jobs, because GitHub's hosted macOS queue can leave a runner unassigned for a
# long time with every other job green. The release waits for the hosts that start now and the
# macOS archive is attached when it is ready, so a queue cannot hold a release in draft.
#
# Nothing on this path reads the build cache. The cache is written by pull request runs, and an
# attested binary should come from a clean build of the tag and nothing else.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # Every job checks this tag out, so a dispatch rebuilds a tag rather than the default
        # branch. That is what makes it useful for finishing a release that did not complete.
        description: the tag to build
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag that does not pass the gate does not become a release. Cheaper to find out here than after
  # the artifacts are uploaded.
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: the version in the tag matches the workspace
        run: |
          set -euo pipefail
          want="${TAG#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "tag $TAG says $want but Cargo.toml says $have"
            exit 1
          fi
          echo "releasing $have"
      - name: the changelog has an entry
        run: |
          set -euo pipefail
          grep -qx "## ${TAG#v}" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          }
      - run: cargo xtask ci

  build:
    name: build for ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-archive
        with:
          target: ${{ matrix.target }}
          tag: ${{ env.TAG }}

  build-queued:
    name: build for ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-archive
        with:
          target: ${{ matrix.target }}
          tag: ${{ env.TAG }}

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance attestation, so someone downloading a binary can check which workflow run and
      # which commit produced it with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: list what is being published
        run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The notes are the changelog section, written by hand, rather than a list of commit subjects.
      - name: take the release notes from the changelog
        run: |
          set -euo pipefail
          awk -v want="## ${TAG#v}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          cat notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" \
              --notes-file notes.md --verify-tag
          fi

  # The macOS archive, put on the release once it exists. --clobber so that re-running ends in the
  # same place rather than in an error about a file that is already there.
  attach:
    name: attach the rest
    needs: [publish, build-queued]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: list what is being attached
        run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: put them on the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"
