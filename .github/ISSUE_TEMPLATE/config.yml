blank_issues_enabled: true
contact_links:
  - name: Question about the design
    url: https://github.com/tamnd/kime/discussions
    about: The specification under spec/ is the design. If something in it does not hold up, a discussion is the right place to say so.
  - name: Security report
    url: https://github.com/tamnd/kime/security/advisories/new
    about: Memory unsafety, a malformed model file that escapes the loader, a way around auth or rate limits, or one request seeing another's data. Please do not open a public issue.
