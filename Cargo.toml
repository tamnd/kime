[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.21"
edition = "2024"
# spec/07-engine.md says 1.90. The floor is raised deliberately, in a commit, and the msrv job in CI
# checks it on every change so that it is never raised by accident in a dependency bump.
rust-version = "1.90.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/kime"
homepage = "https://github.com/tamnd/kime"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["inference", "classification", "calibration", "agents", "encoder"]
categories = ["science", "text-processing", "web-programming::http-server"]
readme = "README.md"

# One version for the whole workspace, bumped together. Internal crates are pinned exactly so that a
# partial publish cannot produce a mixed version build.
[workspace.dependencies]
kime = { version = "=0.0.21", path = "crates/kime" }
kime-ane = { version = "=0.0.21", path = "crates/kime-ane" }
kime-core = { version = "=0.0.21", path = "crates/kime-core" }
kime-cpu = { version = "=0.0.21", path = "crates/kime-cpu" }
kime-cuda = { version = "=0.0.21", path = "crates/kime-cuda" }
kime-engine = { version = "=0.0.21", path = "crates/kime-engine" }
kime-eval = { version = "=0.0.21", path = "crates/kime-eval" }
kime-metal = { version = "=0.0.21", path = "crates/kime-metal" }
kime-model = { version = "=0.0.21", path = "crates/kime-model" }
kime-route = { version = "=0.0.21", path = "crates/kime-route" }
kime-serve = { version = "=0.0.21", path = "crates/kime-serve" }
kime-tensor = { version = "=0.0.21", path = "crates/kime-tensor" }
kime-tok = { version = "=0.0.21", path = "crates/kime-tok" }
kime-train = { version = "=0.0.21", path = "crates/kime-train" }

# Outside crates. Each one is here because writing it ourselves would be worse, and the list is meant to stay short enough to read.
# The HTTP server's router, on hyper and tokio.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
blake3 = { version = "1.8.7", features = ["rayon"] }
# The CUDA driver, NVRTC and cuBLASLt, loaded at run time so the build needs no toolkit.
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "cublaslt", "dynamic-loading", "cuda-12090"] }
half = "2.7.1"
# NVML, loaded at run time like the driver, for the energy counters.
libloading = "0.9.0"
libm = "0.2.16"
memmap2 = "0.9.11"
# Metal and the Objective-C runtime, for the Apple GPU backend.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLBuffer", "MTLResource", "MTLAllocation", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLTypes"] }
serde = { version = "1.0.229", features = ["derive"] }
# SHA-256 for checking downloaded weights against the hub.
sha2 = "0.11.0"
# kime.toml for `kime serve`.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time", "io-util"] }
# The email cleaner in kime-core, a port of Laya's Python regexes.
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# spec/07-engine.md allows unsafe in six crates and asks for a SAFETY comment on every block. The
# lint turns that from a habit into a build failure, and `cargo xtask unsafe` checks the other half,
# which is that the remaining crates forbid it outright.
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"
float_cmp = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
# Line tables only, so a profile of a release build still has function names and line numbers.
debug = "line-tables-only"

# The profile to develop performance work against. Frame pointers and full debug info, because a
# latency budget measured in microseconds is found with a profiler, not by reading code.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "profiling"

# Tests run reference kernels over real shapes, which is painfully slow unoptimized. Optimizing
# dependencies only keeps our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
